
{% extends 'students/base.html' %}

{% block content %}

<div class="container mt-4">

    <h2>Attendance Registration</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-success">
            Save Attendance
        </button>

        <a href="{% url 'attendance_list' %}"
           class="btn btn-secondary">Cancel</a>
    </form>

</div>

{% endblock %}
