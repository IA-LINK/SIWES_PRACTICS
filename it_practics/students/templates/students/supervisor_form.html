
<!DOCTYPE html>
<html>
<head>
    <title>Supervisor Registration</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            padding: 30px;
        }

        .container {
            background: white;
            max-width: 550px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px;
            box-sizing: border-box;
        }

        button {
            background: #123b2a;
            color: white;
            padding: 12px 25px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Supervisor Registration</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Save Supervisor</button>
    </form>

    <p>
        <a href="{% url 'supervisor_list' %}">Back to Supervisors</a>
    </p>
</div>

</body>
</html>
